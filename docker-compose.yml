services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-mascotas
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MascotasCordoba2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MascotasCordoba2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./database:/scripts:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'MascotasCordoba2026!' -C -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'mascotas_cordoba') CREATE DATABASE mascotas_cordoba;"
        if [ -f /scripts/01_schema.sql ]; then
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'MascotasCordoba2026!' -C -d mascotas_cordoba -i /scripts/01_schema.sql
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'MascotasCordoba2026!' -C -d mascotas_cordoba -i /scripts/02_seed_data.sql
        fi

volumes:
  mssql_data:
    name: mssql_mascotas_data

